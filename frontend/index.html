<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Management</h1>

        <form id="studentForm">

            <input
                type="text"
                id="name"
                placeholder="Student Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="text"
                id="course"
                placeholder="Course"
                required
            >

            <button type="submit">Add Student</button>

        </form>

        <h2>Students</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentList"></tbody>
        </table>

    </div>

    <script src="app.js"></script>

</body>
</html>
